name: Deploy BluePlug Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/html/blueplug-frontend
            rm -rf ~/html/blueplug-frontend/.output

      - name: Copy .output to server (tar over SSH - no SFTP)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          tar -czf /tmp/frontend.tar.gz .output
          cat /tmp/frontend.tar.gz | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-9622}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ~/html/blueplug-frontend && tar -xzf - -C ~/html/blueplug-frontend && echo DEPLOY_OK"

      - name: Restart PM2 process
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            export PATH=$PATH:~/.npm-global/bin
            cd ~/html/blueplug-frontend/.output/server
            npm install --production
            cd ~/html/blueplug-frontend
            PORT=3002 npx pm2 delete blueplug-frontend || true
            PORT=3002 npx pm2 start .output/server/index.mjs --name blueplug-frontend
            npx pm2 save